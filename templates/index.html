{% extends 'base.html' %}

{% block content %}

<form action="/" method="POST">
    <input type="text" name="content" placeholder="Enter a task" required>
    <button type="submit">Add Task</button>
</form>

<ul>
    {% for task in tasks %}
    <li class="{% if task.completed %}done{% endif %}">
        <span class="task-text">{{ task.content }}</span>

        <div class="task-buttons">
            <a href="/complete/{{ task.id }}" class="btn complete-btn">Completed</a>
            <a href="/update/{{ task.id }}" class="btn edit-btn">Edit</a>
            <a href="/delete/{{ task.id }}" class="btn delete-btn">Delete</a>
        </div>
    </li>
    {% endfor %}
</ul>


{% endblock %}
