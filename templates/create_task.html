{% extends 'base.html' %}

{% block content %}
<div class="glass task-form-panel">
    <h3><i class="fa-solid fa-plus-circle"></i> Add New Task</h3>
    <form action="" method="POST" class="task-form-row">
        {{ form.hidden_tag() }}
        <div class="form-group">
            {{ form.content(placeholder="What needs to be done?", required=True) }}
        </div>
        <div class="form-group">
            {{ form.due_date(placeholder="Due Date") }}
        </div>
        <div class="form-group">
            {{ form.priority() }}
        </div>
        <div class="form-group">
            {{ form.category_id() }}
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </form>
</div>
{% endblock %}
